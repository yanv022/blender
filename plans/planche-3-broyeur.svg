<text x="269.00" y="184.00" font-size="2.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">bout de goulotte dans le fût (≈ 70 mm)</text>
<text x="20.00" y="45.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000" font-weight="bold">NOTES</text>
<text x="20.00" y="49.20" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• Rien ne doit dépasser du tube de plus de 8 mm : les arbres</text>
<text x="20.00" y="53.40" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">  des rouleaux passent à 10 mm de la paroi.</text>
<text x="20.00" y="57.60" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• Couvercle affleurant Ø 273 × 12 avec joint, charnière plate</text>
<text x="20.00" y="61.80" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">  côté arrière, 3 grenouillères plates (saillie 7 mm).</text>
<text x="20.00" y="66.00" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• Manchons caoutchouc arrêtés 30 mm avant le couvercle.</text>
<text x="20.00" y="70.20" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• Vitesse 55–60 tr/min ; motoréducteur 180–250 W, courroie sous carter.</text>
<text x="20.00" y="74.40" font-size="2.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• Fût chargé ≈ 18 kg : levage au palan (potence, flèche 1,3 m à 1,85 m).</text>
