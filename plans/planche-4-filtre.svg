<text x="260.00" y="40.00" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000" font-weight="bold">NOTES</text>
<text x="260.00" y="44.30" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• Vide maximum :</text>
<text x="260.00" y="48.60" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">   −0,2 bar pour la liqueur et les boues (≥ 85 °C) ;</text>
<text x="260.00" y="52.90" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">   −0,5 bar pour l'hydrate (≈ 50 °C).</text>
<text x="260.00" y="57.20" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">  Au-delà, la liqueur chaude bout dans le récepteur.</text>
<text x="260.00" y="61.50" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• Pompe à vide à membrane avec bouton de réglage + vacuomètre.</text>
<text x="260.00" y="65.80" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• Pompe de transfert inox, 10–20 L/min, compatible soude.</text>
<text x="260.00" y="70.10" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• Deux toiles : 5–10 µm (boues rouges), 10–25 µm (hydrate).</text>
<text x="260.00" y="74.40" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• Les goulottes de R1 et R2 arrivent à 830 du sol,</text>
<text x="260.00" y="78.70" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">  au-dessus du bord de la cuve filtrante (800).</text>
<text x="260.00" y="83.00" font-size="2.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" fill="#000">• La galette sort par le haut avec sa toile.</text>
